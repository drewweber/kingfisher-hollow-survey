name: Update biodiversity report

# Nightly sync of iNaturalist data + deploy of the report to Cloudflare Pages.
on:
  schedule:
    # 13:30 UTC = 9:30 AM Eastern during daylight time (moth season) — late enough
    # to capture the morning's mothing uploads. GitHub cron is UTC only (no DST),
    # so it drifts to 8:30 AM ET in winter. GitHub may also delay scheduled runs.
    - cron: "30 13 * * *"
    # Weekly full refresh of slower regional reference pools used by gap lists.
    - cron: "30 14 * * 0"
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "Daily is faster; full also refreshes regional reference pools."
        type: choice
        required: true
        default: daily
        options:
          - daily
          - full
  # Rebuild + redeploy whenever the report/pipeline code changes on main.
  # Path-filtered so the keep-alive commit (LAST_UPDATED.txt, also [skip ci])
  # and doc-only edits don't trigger a rebuild.
  push:
    branches: [main]
    paths:
      - "report.py"
      - "sync.py"
      - "src/**"
      - "functions/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

# Avoid overlapping runs if one is slow.
concurrency:
  group: update-report
  cancel-in-progress: false

# Needed for the keep-alive commit (see last step).
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # Persist the SQLite DB across runs. On a cache miss the pipeline simply
      # re-pulls from the API (idempotent), so this is an optimisation, not a
      # correctness requirement. Unique save key + prefix restore = "latest".
      - name: Restore database cache
        id: db-cache
        uses: actions/cache@v5
        with:
          path: data/inat.db
          key: inat-db-${{ github.run_id }}
          restore-keys: |
            inat-db-

      - name: Restore report input cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: report-inputs-${{ github.run_id }}
          restore-keys: |
            report-inputs-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test pipeline helpers
        run: python -m unittest discover -s tests

      - name: Choose refresh scope
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 14 * * 0" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "scope=${{ github.event.inputs.refresh_scope || 'daily' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Refresh scope: $(tail -n 1 "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Sync observations and uniqueness stats
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.scope }}" = "full" ]; then
            timeout 25m python -u sync.py --all --stats-workers 1 --stats-limit 300
          else
            timeout 8m python -u sync.py --daily --stats-workers 1
          fi

      - name: Build report
        run: python report.py

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: field-alerts/package-lock.json

      - name: Install Wrangler
        run: npm ci --prefix field-alerts --ignore-scripts

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: field-alerts/node_modules/.bin/wrangler pages deploy public --project-name=kingfisher-survey --commit-dirty=true

      # GitHub disables scheduled workflows after 60 days of no repo commits.
      # Refresh the marker monthly, and only from scheduled runs, so pushes and
      # manual updates do not create extra remote commits.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          if [ -f LAST_UPDATED.txt ]; then
            last_date=$(cut -c1-10 LAST_UPDATED.txt)
            last_epoch=$(date -u -d "$last_date" +%s 2>/dev/null || echo 0)
            cutoff_epoch=$(date -u -d "30 days ago" +%s)
            if [ "$last_epoch" -ge "$cutoff_epoch" ]; then
              echo "LAST_UPDATED.txt is recent; skipping keep-alive commit."
              exit 0
            fi
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_UPDATED.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_UPDATED.txt
          git commit -m "chore: nightly update $(date -u +%Y-%m-%d) [skip ci]" \
            && git push || echo "nothing to commit"
