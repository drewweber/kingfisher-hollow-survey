name: Deploy field alerts

# Deployment uses GitHub Actions, but the running alert monitor does not. The
# Worker polls iNaturalist directly through a three-minute Cloudflare Cron Trigger.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: field-alerts/package-lock.json

      - name: Install and test
        working-directory: field-alerts
        run: |
          npm ci
          npm test

      - name: Deploy Cloudflare Worker
        working-directory: field-alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Add the CLOUDFLARE_WORKERS_API_TOKEN repository secret."
            exit 1
          fi
          npx wrangler deploy
