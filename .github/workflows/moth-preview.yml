name: Moth page review preview

on:
  push:
    branches: [agent/moth-page-redesign-2026-11-12]

permissions:
  contents: read

concurrency:
  group: moth-page-review-preview
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            field-alerts/package-lock.json

      - name: Restore existing observation database
        uses: actions/cache/restore@v5
        with:
          path: data/inat.db
          key: moth-review-db-${{ github.run_id }}
          restore-keys: |
            inat-db-
          fail-on-cache-miss: true

      - name: Restore report inputs
        uses: actions/cache/restore@v5
        with:
          path: data/cache
          key: moth-review-inputs-${{ github.run_id }}
          restore-keys: |
            report-inputs-

      - name: Install dependencies and check source
        run: |
          test -s data/inat.db
          pip install -r requirements.txt
          npm ci --ignore-scripts
          npm ci --prefix field-alerts --ignore-scripts
          python -m unittest discover -s tests
          node --test tests/*.test.mjs

      - name: Build and check static pages
        env:
          KH_REVIEW_PREVIEW: "1"
          KH_HOME_URL: "https://www.kingfisher-hollow.com"
        run: |
          npm run build:css
          python report.py
          python tests/verify_survey_pages.py
          python tests/verify_seasonal_pages.py
          python scripts/prepare_review_preview.py --survey-url https://moth-page-2026-11-12.kingfisher-survey.pages.dev
          python tests/verify_seasonal_pages.py
          test ! -e public/_worker.js
          test ! -e public/_routes.json
          test -z "$(find public -type l -print -quit)"
          test -z "$(find public -type f \( -iname '*.sqlite*' -o -iname '*.db*' -o -iname '.env*' -o -iname '*.pem' -o -iname '*.key' \) -print -quit)"
          python scripts/verify_preview_csv.py
          grep -Fq 'Review preview' public/index.html
          grep -Fq 'Review preview' public/fungi/index.html
          if grep -Fq 'id="trigger-update"' public/log/index.html; then
            echo "::error::The preview contains the refresh action."
            exit 1
          fi

      - name: Deploy static review branch only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test "$GITHUB_REF" = refs/heads/agent/moth-page-redesign-2026-11-12
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kingfisher-survey" \
            | jq -e '.success and .result.name == "kingfisher-survey" and .result.production_branch == "main"' >/dev/null
          stage=$(mktemp -d)
          cd "$stage"
          "$GITHUB_WORKSPACE/field-alerts/node_modules/.bin/wrangler" pages deploy "$GITHUB_WORKSPACE/public" \
            --project-name=kingfisher-survey --branch=moth-page-2026-11-12 \
            --commit-hash="$GITHUB_SHA" </dev/null

      - name: Verify hosted moth review
        run: |
          review_url=https://moth-page-2026-11-12.kingfisher-survey.pages.dev
          for route in moths seasons seasons/summer; do
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$review_url/$route/" -o "$RUNNER_TEMP/review.html"
            grep -Fq 'Review preview' "$RUNNER_TEMP/review.html"
            grep -Fq 'Kingfisher Hollow' "$RUNNER_TEMP/review.html"
          done
          echo "Moth page review: $review_url/moths/"
