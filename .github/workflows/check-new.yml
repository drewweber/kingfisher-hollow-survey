name: Check for new observations

# Cheap, frequent poll: ask iNaturalist whether the project has a new
# observation or an observation edited since the last property sync. If so,
# dispatch the heavy update.yml (sync + build + deploy); otherwise do nothing.
# The nightly schedule in update.yml remains the backstop that catches anything
# this poll misses (e.g. an older observation newly added to the project).
on:
  schedule:
    # Every hour at :45, around the clock. Off the top of the hour on purpose —
    # GitHub delays cron heavily at :00 under load.
    - cron: "45 * * * *"
  workflow_dispatch: {}

# One poll at a time; never cancel an in-flight check.
concurrency:
  group: check-new
  cancel-in-progress: false

# actions:write lets us dispatch update.yml via the GITHUB_TOKEN. workflow_dispatch
# is one of the two events that *can* be triggered by GITHUB_TOKEN, so this works.
permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Read-only restore of the latest DB cache written by update.yml. Using the
      # restore-only action means this job never writes a cache entry, so it can't
      # race the heavy job's cache.
      - name: Restore database cache (read-only)
        uses: actions/cache/restore@v5
        with:
          path: data/inat.db
          key: inat-db-check-${{ github.run_id }}
          restore-keys: |
            inat-db-

      - name: Compare iNat new and updated observations to local DB
        id: cmp
        run: |
          set -euo pipefail
          PROJECT_ID=249580
          LATEST=$(curl -s --max-time 30 \
            "https://api.inaturalist.org/v1/observations?project_id=${PROJECT_ID}&order_by=id&order=desc&per_page=1&only_id=true" \
            | jq '.results[0].id // 0')
          if [ -f data/inat.db ]; then
            HAVE=$(sqlite3 data/inat.db "SELECT COALESCE(MAX(id),0) FROM property_obs" 2>/dev/null || echo 0)
            SYNCED=$(sqlite3 data/inat.db "SELECT synced_at FROM sync_log WHERE source = 'property' ORDER BY id DESC LIMIT 1" 2>/dev/null || true)
          else
            HAVE=0
            SYNCED=""
          fi
          HAVE=${HAVE:-0}
          UPDATED=0
          # A new ID already guarantees a dispatch, whose property sync also
          # processes edits. Only make the second poll when it can affect the
          # decision, and request no result rows because only the count is read.
          if [ "${LATEST:-0}" -le "${HAVE:-0}" ] && [ -n "$SYNCED" ]; then
            UPDATED_SINCE="${SYNCED/ /T}Z"
            UPDATED=$(curl -s --max-time 30 --get \
              --data-urlencode "project_id=${PROJECT_ID}" \
              --data-urlencode "updated_since=${UPDATED_SINCE}" \
              --data-urlencode "order_by=updated_at" \
              --data-urlencode "order=desc" \
              --data-urlencode "per_page=0" \
              "https://api.inaturalist.org/v1/observations" \
              | jq '.total_results // 0')
          fi
          UPDATED=${UPDATED:-0}
          echo "iNat latest obs id: $LATEST   |   already ingested: $HAVE"
          echo "iNat updates since last property sync: $UPDATED"
          if [ "${LATEST:-0}" -gt "${HAVE:-0}" ] || [ "$UPDATED" -gt 0 ]; then
            echo "New or corrected observations detected → will trigger daily update."
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new or corrected → skipping daily update."
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger daily update when new data exists
        if: steps.cmp.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -f refresh_scope=daily
